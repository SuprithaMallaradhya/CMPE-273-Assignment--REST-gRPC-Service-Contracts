syntax = "proto3";

package inventory;

service InventoryService {
  rpc CheckInventory(CheckInventoryRequest)
      returns (CheckInventoryResponse);
}

message CheckInventoryRequest {
  string item_id = 1;
  int32 quantity = 2;
}

message CheckInventoryResponse {
  bool available = 1;
  string item_id = 2;
  int32 requested_quantity = 3;
  int32 available_quantity = 4;
  string message = 5;
}
